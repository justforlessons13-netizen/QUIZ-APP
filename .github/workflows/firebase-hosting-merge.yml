# This file tells GitHub Actions to deploy to Firebase Hosting on every push to "main"
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main # Change this if your main branch is named "master"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: npm ci # Use 'npm install' if you don't have a package-lock.json

      - name: Build Project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: my-app-e17be.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: my-app-e17be
          VITE_FIREBASE_STORAGE_BUCKET: my-app-e17be.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '679812602133'
          VITE_FIREBASE_APP_ID: 1:679812602133:web:06c3069b74265d2dbdb11c

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_APP_E17BE }}'
          channelId: live
          projectId: "my-app-e17be" # Replace with your actual Firebase Project ID